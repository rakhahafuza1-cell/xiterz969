<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XITERZ 969</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050208;
    --bg2: #0d0614;
    --card: rgba(14, 7, 22, .88);
    --text: #ffffff;
    --muted: #a99bb2;
    --primary: #b026ff;
    --secondary: #6a00ff;
    --border: rgba(190, 60, 255, .5);
    --shadow: rgba(151, 0, 255, .45);
}

body.light {
    --bg: #eee7ff;
    --bg2: #dcd0ff;
    --card: rgba(255, 255, 255, .86);
    --text: #1b1025;
    --muted: #665b70;
    --primary: #7b16d9;
    --secondary: #4c00c9;
    --border: rgba(110, 20, 190, .4);
    --shadow: rgba(100, 0, 200, .25);
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 50% 0%, rgba(170, 0, 255, .35), transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(75, 0, 255, .28), transparent 35%),
        var(--bg);

    display: flex;
    justify-content: center;
    padding: 25px 12px;

    transition:
        background .4s,
        color .4s;
}

/* GRID BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(rgba(160, 30, 255, .09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160, 30, 255, .09) 1px, transparent 1px);

    background-size: 45px 45px;

    pointer-events: none;
}

/* MAIN */

.container {
    width: 100%;
    max-width: 620px;
    position: relative;
    z-index: 2;
}

/* TOP BAR */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.brand {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 4px;

    color: var(--primary);

    text-shadow:
        0 0 8px var(--primary),
        0 0 20px var(--shadow);
}

.mode-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);

    padding: 10px 14px;

    border-radius: 12px;

    cursor: pointer;

    box-shadow:
        0 0 15px var(--shadow);

    transition: .25s;
}

.mode-btn:hover {
    transform: translateY(-2px);
}

/* HERO */

.hero {
    text-align: center;

    padding: 40px 25px 30px;

    border: 1px solid var(--border);
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(35, 8, 50, .94),
            var(--card)
        );

    box-shadow:
        0 0 20px var(--shadow),
        inset 0 0 40px rgba(170, 0, 255, .06);

    overflow: hidden;

    position: relative;
}

body.light .hero {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(237,224,255,.9)
        );
}

.hero::before {
    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    left: 50%;
    top: -150px;

    transform: translateX(-50%);

    background: #b000ff;

    filter: blur(90px);

    opacity: .35;
}

.logo {
    position: relative;

    font-size: 62px;

    margin-bottom: 10px;

    color: #d879ff;

    text-shadow:
        0 0 10px #c000ff,
        0 0 30px #9900ff,
        0 0 70px #7100ff;

    animation: pulse 2.5s infinite alternate;
}

@keyframes pulse {
    from {
        transform: scale(1);
        filter: brightness(1);
    }

    to {
        transform: scale(1.06);
        filter: brightness(1.3);
    }
}

h1 {
    position: relative;

    font-size: 32px;

    letter-spacing: 6px;

    color: var(--text);

    text-shadow:
        0 0 12px var(--primary),
        0 0 30px var(--shadow);
}

.subtitle {
    position: relative;

    margin-top: 12px;

    color: var(--muted);

    font-size: 12px;

    letter-spacing: 4px;
}

/* STATUS */

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin-top: 22px;

    padding: 10px 16px;

    border-radius: 30px;

    background: rgba(0, 255, 120, .07);

    border: 1px solid rgba(0, 255, 120, .25);

    color: #55ff9a;

    font-size: 13px;
    font-weight: bold;

    box-shadow:
        0 0 15px rgba(0, 255, 120, .1);
}

.dot {
    width: 9px;
    height: 9px;

    background: #32ff7e;

    border-radius: 50%;

    box-shadow:
        0 0 10px #32ff7e;
}

/* FILE CARD */

.file-card {
    margin-top: 20px;

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(30, 9, 43, .94),
            rgba(9, 4, 15, .94)
        );

    border: 1px solid var(--border);

    border-radius: 20px;

    text-align: left;

    position: relative;

    overflow: hidden;

    transition: .3s;

    box-shadow:
        0 0 18px rgba(130, 0, 220, .12);
}

body.light .file-card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.94),
            rgba(241,232,255,.95)
        );
}

.file-card:hover {
    transform: translateY(-4px);

    border-color: var(--primary);

    box-shadow:
        0 0 25px var(--shadow);
}

.file-card::after {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    right: -50px;
    top: -50px;

    background: var(--primary);

    filter: blur(50px);

    opacity: .25;
}

/* TITLE */

.file-title {
    position: relative;
    z-index: 1;

    color: var(--primary);

    font-size: 21px;

    font-weight: bold;

    text-shadow:
        0 0 10px var(--shadow);
}

.file-desc {
    position: relative;
    z-index: 1;

    margin-top: 8px;

    color: var(--muted);

    font-size: 13px;
}

/* KEY */

.key-box {
    position: relative;
    z-index: 1;

    margin-top: 18px;

    padding: 16px;

    border-radius: 12px;

    background: rgba(0, 0, 0, .25);

    border: 1px solid rgba(190, 60, 255, .25);

    text-align: center;
}

.key-label {
    color: var(--muted);

    font-size: 10px;

    letter-spacing: 3px;

    margin-bottom: 8px;
}

.key {
    color: #d789ff;

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 3px;

    text-shadow:
        0 0 12px #a600ff;
}

/* BUTTON */

.download {
    position: relative;
    z-index: 1;

    display: block;

    width: 100%;

    margin-top: 18px;

    padding: 16px;

    border-radius: 12px;

    text-align: center;

    text-decoration: none;

    color: white;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 2px;

    background:
        linear-gradient(
            90deg,
            #6500c9,
            #b000ff,
            #6500c9
        );

    background-size: 200% 100%;

    box-shadow:
        0 0 18px rgba(160, 0, 255, .45);

    transition: .3s;
}

.download:hover {
    background-position: 100% 0;

    transform: translateY(-2px);

    box-shadow:
        0 0 30px rgba(190, 0, 255, .7);
}

.download:active {
    transform: scale(.98);
}

/* FOOTER */

.footer {
    text-align: center;

    margin-top: 25px;
    padding-top: 20px;

    border-top: 1px solid var(--border);

    color: var(--primary);

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px var(--shadow);
}

/* RESPONSIVE */

@media(max-width: 450px) {

    body {
        padding: 15px 10px;
    }

    .hero {
        padding: 32px 18px 25px;
    }

    .logo {
        font-size: 52px;
    }

    h1 {
        font-size: 25px;
        letter-spacing: 4px;
    }

    .file-card {
        padding: 20px;
    }
}
</style>
</head>

<script>

function toggleMode() {

    document.body.classList.toggle("light");

    const button =
        document.getElementById("modeButton");

    if (document.body.classList.contains("light")) {

        button.innerHTML = "🌙 DARK";

        localStorage.setItem(
            "xiterz_mode",
            "light"
        );

    } else {

        button.innerHTML = "☀️ LIGHT";

        localStorage.setItem(
            "xiterz_mode",
            "dark"
        );
    }
}


/* Simpan mode yang terakhir dipakai */

const savedMode =
    localStorage.getItem("xiterz_mode");

if (savedMode === "light") {

    document.body.classList.add("light");

    document.getElementById("modeButton").innerHTML =
        "🌙 DARK";
}

</script>

</body>
