<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#07000f; --panel:rgba(18,3,31,.82); --panel2:rgba(34,5,54,.72);
  --text:#fff; --muted:#b9a6c8; --accent:#b000ff; --accent2:#6a00ff;
  --good:#00ff88; --danger:#ff3864; --line:rgba(190,60,255,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(160,0,255,.34),transparent 34%),
    radial-gradient(circle at 0 70%,rgba(70,0,255,.18),transparent 32%),
    var(--bg);
  overflow-x:hidden;
}
body.light{
  --bg:#eef2ff; --panel:rgba(255,255,255,.84); --panel2:rgba(255,255,255,.72);
  --text:#171126; --muted:#665c79; --line:rgba(111,0,255,.25);
  background:
    radial-gradient(circle at 50% -10%,rgba(168,92,255,.35),transparent 36%),
    linear-gradient(135deg,#f8f5ff,#e9e5ff);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(180,0,255,.25) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(180,0,255,.25) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 85%);
}
canvas#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
button,input{font:inherit}
.hidden{display:none!important}

/* KEY SCREEN */
#gate{
  min-height:100vh;display:grid;place-items:center;padding:24px;
}
.gate-card{
  width:min(440px,100%);padding:34px 24px;border:1px solid var(--line);
  border-radius:28px;background:var(--panel);backdrop-filter:blur(18px);
  box-shadow:0 0 45px rgba(174,0,255,.25),inset 0 0 35px rgba(160,0,255,.06);
  text-align:center;animation:pop .7s ease both;
}
.logo{
  width:82px;height:82px;margin:0 auto 18px;border-radius:24px;
  display:grid;place-items:center;font-size:38px;
  background:linear-gradient(145deg,#23003c,#0b0013);
  border:1px solid #c53cff;box-shadow:0 0 30px rgba(190,0,255,.7);
  animation:pulse 2s infinite;
}
h1{margin:0;font-size:29px;letter-spacing:7px}
.sub{margin:9px 0 26px;color:var(--muted);letter-spacing:4px;font-size:12px}
.input-wrap{position:relative}
#keyInput{
  width:100%;padding:17px 16px;border-radius:15px;border:1px solid var(--line);
  outline:none;background:rgba(0,0,0,.22);color:var(--text);text-align:center;
  letter-spacing:3px;font-weight:700;box-shadow:inset 0 0 18px rgba(180,0,255,.06);
}
#keyInput:focus{border-color:#d64cff;box-shadow:0 0 20px rgba(190,0,255,.2)}
.btn{
  width:100%;margin-top:13px;padding:16px;border:0;border-radius:15px;
  color:#fff;font-weight:900;letter-spacing:2px;cursor:pointer;
  background:linear-gradient(100deg,#6900ff,#c000ff,#6d00ff);
  background-size:200% 100%;box-shadow:0 0 24px rgba(171,0,255,.35);
  animation:gradient 3s linear infinite;transition:.2s;
}
.btn:active{transform:scale(.98)}
#gateMsg{min-height:20px;margin-top:13px;font-size:13px;font-weight:700}

/* APP */
header{
  position:sticky;top:0;z-index:10;padding:16px 18px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(7,0,15,.55);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
body.light header{background:rgba(255,255,255,.58)}
.brand{font-weight:1000;letter-spacing:4px}
.mode{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:10px 13px;border-radius:12px;cursor:pointer;
}
.container{width:min(720px,92%);margin:auto;padding:35px 0 45px}
.hero{text-align:center;padding:25px 0 35px;animation:fadeUp .8s ease both}
.hero-icon{
  width:96px;height:96px;margin:auto;border-radius:28px;display:grid;place-items:center;
  font-size:43px;background:linear-gradient(145deg,#25003f,#08000d);
  border:1px solid #d24aff;box-shadow:0 0 45px rgba(196,0,255,.65);
  animation:float 3s ease-in-out infinite;
}
body.light .hero-icon{background:linear-gradient(145deg,#fff,#e6dcff)}
.hero h2{font-size:clamp(32px,8vw,56px);margin:22px 0 8px;letter-spacing:8px}
.hero p{color:var(--muted);letter-spacing:5px;font-size:12px}
.status{
  display:inline-flex;align-items:center;gap:9px;margin-top:10px;padding:10px 16px;
  border:1px solid rgba(0,255,136,.3);border-radius:99px;color:var(--good);
  background:rgba(0,255,136,.05);box-shadow:0 0 22px rgba(0,255,136,.08);
}
.dot{width:10px;height:10px;background:var(--good);border-radius:50%;box-shadow:0 0 13px var(--good);animation:blink 1.2s infinite}

.card{
  position:relative;overflow:hidden;margin:18px 0;padding:25px;border-radius:24px;
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);
  box-shadow:0 0 30px rgba(155,0,255,.12),inset 0 0 30px rgba(155,0,255,.04);
  animation:fadeUp .7s ease both;
}
.card:before{
  content:"";position:absolute;width:150px;height:150px;right:-80px;top:-80px;
  background:#c000ff;border-radius:50%;filter:blur(55px);opacity:.18;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(155,0,255,.22);transition:.25s}
.card h3{margin:0 0 8px;font-size:23px}
.card p{color:var(--muted);margin:0 0 18px}
.keybox{
  padding:18px;text-align:center;border:1px solid var(--line);border-radius:16px;
  background:rgba(0,0,0,.18);margin-bottom:14px;
}
.keylabel{font-size:11px;letter-spacing:4px;color:var(--muted)}
.keyvalue{display:block;margin-top:9px;font-size:25px;font-weight:900;letter-spacing:4px;color:#d982ff;text-shadow:0 0 16px rgba(205,0,255,.7)}
.download{display:block;text-decoration:none;text-align:center}
.copy{
  background:transparent;border:1px solid var(--line);color:var(--text);
  margin-top:10px;animation:none;
}
.copy:hover{background:rgba(170,0,255,.1)}
.note{font-size:12px!important}
footer{text-align:center;color:#ad68d0;letter-spacing:4px;font-size:11px;padding:18px 0 5px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);
  opacity:0;z-index:30;padding:13px 18px;border-radius:14px;
  background:#170024;color:#fff;border:1px solid #b92eff;
  box-shadow:0 0 25px rgba(190,0,255,.35);transition:.3s;pointer-events:none;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 48px rgba(190,0,255,.9)}}
@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes blink{50%{opacity:.35}}
@keyframes gradient{0%{background-position:0 50%}100%{background-position:200% 50%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.music-control{
  position:fixed;right:16px;top:76px;z-index:20;
  border:1px solid rgba(210,74,255,.55);
  border-radius:14px;padding:11px 13px;
  color:#fff;background:rgba(20,0,32,.78);
  backdrop-filter:blur(12px);
  box-shadow:0 0 22px rgba(180,0,255,.28);
  cursor:pointer;font-size:12px;font-weight:900;letter-spacing:1px;
  transition:.2s;
}
.music-control.on{
  border-color:#00ff88;
  box-shadow:0 0 24px rgba(0,255,136,.28);
  color:#00ff88;
}
body.light .music-control{
  color:#171126;background:rgba(255,255,255,.8);
}

</style>

<script>

Z-T9KC-4NPA"];

function login(){
  const input=document.getElementById("keyInput").value.trim();
  const msg=document.getElementById("gateMsg");
  if(!KEYS.includes(input)){
    msg.style.color="var(--danger)";
    msg.textContent="✖ ACCESS KEY INVALID";
    document.querySelector(".gate-card").animate(
      [{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(0)"}],
      {duration:240}
    );
    return;
  }
  localStorage.setItem("xiterz_access","1");
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  showToast("✓ ACCESS GRANTED");
}

function toggleMode(){
  document.body.classList.toggle("light");
  localStorage.setItem("xiterz_mode",document.body.classList.contains("light")?"light":"dark");
  document.querySelector(".mode").textContent =
    document.body.classList.contains("light") ? "🌙 DARK" : "☀️ LIGHT";
}

function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}

document.getElementById("keyInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});

if(localStorage.getItem("xiterz_mode")==="light") toggleMode();

/* Particle background */
const canvas=document.getElementById("particles"),ctx=canvas.getContext("2d");
let w,h,particles=[];
function resize(){
  w=canvas.width=innerWidth*devicePixelRatio;
  h=canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function makeParticles(){
  particles=Array.from({length:55},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,
    r:Math.random()*1.8+.5
  }));
}
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const light=document.body.classList.contains("light");
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>innerWidth)p.vx*=-1;
    if(p.y<0||p.y>innerHeight)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=light?"rgba(105,0,255,.38)":"rgba(205,80,255,.65)";
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
addEventListener("resize",()=>{resize();makeParticles()});
resize();makeParticles();draw();

const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");
const musicText = document.getElementById("musicText");

function updateMusicButton(){
  const on = !music.paused;
  musicBtn.classList.toggle("on", on);
  musicText.textContent = on ? "MUSIC ON" : "MUSIC OFF";
  musicBtn.firstChild.textContent = on ? "🔊 " : "🎵 ";
}

function toggleMusic(){
  if(music.paused){
    music.play().then(updateMusicButton).catch(()=>{
      showToast("⚠️ Tekan tombol lagi untuk memulai musik");
    });
  }else{
    music.pause();
    updateMusicButton();
  }
}

music.addEventListener("play", updateMusicButton);
music.addEventListener("pause", updateMusicButton);

</script>
